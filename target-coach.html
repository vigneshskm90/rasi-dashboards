<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f7a3f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Rasi Target Coach</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f4f6f1;--card:#fff;--ink:#1d2a1f;--muted:#66726a;--line:#e3e8e0;
  --acc:#1f7a3f;--acc2:#e8f3ec;--warn:#b5462f;--warn2:#fbece8;--gold:#b7860b;--gold2:#fbf4de;
  --r:14px;--sh:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111613;--card:#1a211c;--ink:#e8eee9;--muted:#9aa69d;--line:#2a332c;
  --acc:#4cc27a;--acc2:#1b2e22;--warn:#ef8a73;--warn2:#35211c;--gold:#e5b94a;--gold2:#30291a;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
button,select,input,.chip,.opt,.item{touch-action:manipulation}
body{overscroll-behavior-y:contain;margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1080px;margin:0 auto;padding:12px 14px 90px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
header h1{font-size:19px;margin:0;flex:1;min-width:160px}
header h1 small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 13px;font:inherit;font-weight:600;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn:active{transform:scale(.97)}
.banner{background:var(--gold2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:10px}
.sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 8px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-weight:600;padding:8px 4px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.filters label{flex:1 1 140px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
select,input[type=search]{width:100%;margin-top:2px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:14px}
.crumbs{font-size:13px;color:var(--muted);margin:6px 2px 0;min-height:18px}
.crumbs a{color:var(--acc);cursor:pointer;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh)}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.hero{background:var(--acc);color:#fff;border-color:var(--acc)}
.kpi.hero .l,.kpi.hero .s{color:rgba(255,255,255,.85)}
.up{color:var(--acc);font-weight:700}.dn{color:var(--warn);font-weight:700}
.kpi.hero .up,.kpi.hero .dn{color:#fff}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh);margin-bottom:12px}
.panel h3{margin:0 0 10px;font-size:15px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh);cursor:pointer}
.item .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk{width:30px;height:30px;border-radius:50%;background:var(--acc2);color:var(--acc);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.big{font-size:22px;font-weight:800;letter-spacing:-.02em}
.meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.meta b{color:var(--ink)}
.twin{display:grid;grid-template-columns:34px 1fr 64px;gap:5px 8px;align-items:center;margin-top:9px;font-size:12px;color:var(--muted)}
.twin .tr{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.twin .tr i{display:block;height:100%;border-radius:5px;min-width:2px}
.twin .ly i{background:#b4b2a9}.twin .pl i{background:#1d9e75}
.twin .n{text-align:right;font-variant-numeric:tabular-nums}.twin .n.b{color:var(--ink);font-weight:700}
@media (prefers-color-scheme:dark){.twin .ly i{background:#5f5e5a}.twin .pl i{background:#3cc493}}
.legend{font-size:11px;color:var(--muted);margin-top:4px}
.mix{display:flex;height:28px;border-radius:8px;overflow:hidden;margin:6px 0}
.mix div{display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;min-width:0;overflow:hidden;white-space:nowrap}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:10;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:12px;font-weight:600;padding:9px 2px 10px;cursor:pointer}
.tabs button span{display:block;font-size:19px;line-height:1.2}
.tabs button.on{color:var(--acc)}
/* flashcards */
.fc-wrap{max-width:460px;margin:8px auto}
.card3d{perspective:1200px;height:300px;cursor:pointer}
.card3d .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card3d.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;padding:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.08);border:1px solid var(--line);background:var(--card)}
.face.back{transform:rotateY(180deg);background:var(--acc);color:#fff;border-color:var(--acc)}
.face .tag{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.face.back .tag{color:rgba(255,255,255,.8)}
.face .q{font-size:26px;font-weight:800;margin:10px 0;word-break:break-word}
.face .hint{font-size:14px;color:var(--muted)}
.face .ans{font-size:44px;font-weight:900;letter-spacing:-.03em;margin:6px 0}
.face .sub{font-size:14px;opacity:.92;line-height:1.6}
.fc-btns{display:flex;gap:10px;margin-top:14px}
.fc-btns .btn{flex:1;padding:13px}
.btn.miss{background:var(--warn2);color:var(--warn);border-color:transparent}
.btn.ok{background:var(--acc2);color:var(--acc);border-color:transparent}
.prog{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 4px}
.prog i{display:block;height:100%;background:var(--gold)}
.small{font-size:12px;color:var(--muted)}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:14px;font:inherit;font-size:17px;font-weight:700;cursor:pointer;text-align:left}
.opt.right{border-color:var(--acc);background:var(--acc2)}
.opt.wrong{border-color:var(--warn);background:var(--warn2)}
.qbox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--sh)}
.qbox .q{font-size:19px;font-weight:700;margin:6px 0}
.score{display:flex;gap:10px;justify-content:center;margin-bottom:10px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:13px;font-weight:700}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.hide{display:none!important}
.sm{display:none}
.chipwrap{flex:1 1 100%;display:flex;gap:8px 14px;flex-wrap:wrap}
.chips{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.chips .cl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-right:2px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:5px 11px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.tg{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:10px;margin:2px 4px 0 0;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--ink);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.mx{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;font-size:13px;align-items:stretch}
.mx>div{background:var(--bg);border-radius:10px;padding:8px 10px}
.mx .h{background:none;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;padding:2px 4px;align-self:end}
.mx b{font-size:17px;display:block}
.clk{cursor:pointer}
.pf{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}

.unit{display:flex;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:3px;cursor:pointer;user-select:none}
.unit span{padding:6px 12px;border-radius:16px;font-weight:700;font-size:13px;color:var(--muted)}
.unit span.on{background:var(--ink);color:var(--card)}

/* ===== device layouts ===== */
.tools{display:flex;gap:8px;align-items:center}
.devsw{display:flex;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:3px;user-select:none}
.devsw span{padding:6px 11px;border-radius:16px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.devsw span.on{background:var(--acc);color:#fff}
.fbar{display:flex;align-items:center;gap:8px;margin-top:6px}
.fbar .crumbs{margin:0;flex:1}
.fbtn{display:none}
.side{display:contents}
.swipehint{display:none}
/* --- PC --- */
body.dev-pc .wrap{max-width:1280px;padding-bottom:30px}
body.dev-pc .tabs{position:static;border:1px solid var(--line);border-radius:12px;margin-top:8px}
body.dev-pc .tabs button{display:flex;align-items:center;justify-content:center;gap:7px;font-size:14px;padding:11px}
body.dev-pc .tabs button span{display:inline;font-size:17px}
body.dev-pc .kbhint{display:block}
/* --- Phone (Pixel 10 Pro first: ~412 css px wide, gesture bar) --- */
body.dev-phone{font-size:16px}
body.dev-phone .wrap{max-width:480px;padding:calc(10px + env(safe-area-inset-top)) 12px calc(88px + env(safe-area-inset-bottom))}
body.dev-phone header{gap:8px}
body.dev-phone header h1{order:1;min-width:0;font-size:18px}
body.dev-phone #loadBtn{order:2;padding:10px 14px;min-height:44px}
body.dev-phone .tools{order:3;flex:1 1 100%;justify-content:space-between}
body.dev-phone .lg{display:none}body.dev-phone .sm{display:inline}
body.dev-phone .devsw span,body.dev-phone .unit span{padding:8px 12px;font-size:14px}
body.dev-phone .tabs{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;border-radius:16px 16px 0 0;box-shadow:0 -4px 16px rgba(0,0,0,.06)}
body.dev-phone .tabs button{min-height:62px;font-size:12.5px}
body.dev-phone .tabs button span{font-size:22px}
body.dev-phone .seg button{min-height:44px;font-size:15px}
body.dev-phone .fbtn{display:inline-block;min-height:40px;padding:8px 12px;font-size:14px;flex:none}
body.dev-phone .filters{display:none;grid-template-columns:1fr 1fr;gap:8px}
body.dev-phone .filters.open{display:grid}
body.dev-phone .filters label{flex:none}
body.dev-phone .chipwrap{grid-column:1/-1}
body.dev-phone .chip{min-height:38px;padding:7px 13px;font-size:14px}
body.dev-phone select,body.dev-phone input[type=search]{font-size:16px;min-height:44px}
body.dev-phone .kpis{grid-template-columns:1fr 1fr;gap:8px}
body.dev-phone .kpi{padding:11px 12px}
body.dev-phone .kpi.hero{grid-column:1/-1}
body.dev-phone .kpis .kpi:last-child{grid-column:1/-1}
body.dev-phone .kpi .v{font-size:23px}
body.dev-phone .list{grid-template-columns:1fr}
body.dev-phone .pf{grid-template-columns:1fr}
body.dev-phone .card3d{height:min(54vh,440px)}
body.dev-phone .fc-btns .btn{min-height:54px;font-size:16px}
body.dev-phone .opt{min-height:56px}
body.dev-phone .swipehint{display:block}
/* --- iPad Pro 11" (834×1194 portrait / 1194×834 landscape) --- */
body.dev-ipad{font-size:16px}
body.dev-ipad .wrap{max-width:1194px;padding:calc(14px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom))}
body.dev-ipad .layout{display:grid;grid-template-columns:272px minmax(0,1fr);gap:20px;align-items:start}
body.dev-ipad .side{display:block;position:sticky;top:12px;max-height:calc(100dvh - 24px);overflow:auto;padding-bottom:10px}
body.dev-ipad .sticky{position:static;padding-top:0}
body.dev-ipad .tabs{position:static;flex-direction:column;border:1px solid var(--line);border-radius:14px;margin-top:10px;padding:5px;gap:2px}
body.dev-ipad .tabs button{display:flex;align-items:center;gap:12px;font-size:16px;padding:13px 14px;border-radius:10px;text-align:left}
body.dev-ipad .tabs button span{display:inline;font-size:20px}
body.dev-ipad .tabs button.on{background:var(--acc2)}
body.dev-ipad .seg button{min-height:44px}
body.dev-ipad .filters{flex-direction:column;flex-wrap:nowrap;gap:10px;margin-top:12px}
body.dev-ipad .filters label{flex:none}
body.dev-ipad select,body.dev-ipad input[type=search]{font-size:16px;min-height:44px}
body.dev-ipad .chip{min-height:38px}
body.dev-ipad .chips .cl{flex:1 1 100%;margin-top:4px}
body.dev-ipad .fbar{margin-top:10px}
body.dev-ipad .kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
body.dev-ipad .list{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
body.dev-ipad .fc-wrap{max-width:600px}
body.dev-ipad .card3d{height:min(58vh,440px)}
body.dev-ipad .face .q{font-size:32px}
body.dev-ipad .face .ans{font-size:58px}
body.dev-ipad .fc-btns .btn{min-height:56px;font-size:17px}
body.dev-ipad .opt{min-height:58px;font-size:19px}
body.dev-ipad .swipehint{display:block}
@media(max-width:720px){body.dev-ipad .layout{display:block}body.dev-ipad .side{position:static;max-height:none}}
.kbhint{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Rasi Target Coach<small id="fileInfo">Sample data</small></h1>
    <input type="file" id="file" accept=".xlsx,.xls,.xlsm,.csv" class="hide">
    <div class="tools">
      <div class="devsw" id="devSw" title="Layout for your device"><span data-dv="pc">🖥 PC</span><span data-dv="phone">📱 Phone</span><span data-dv="ipad">iPad</span></div>
      <div class="unit" id="unitSw" role="switch" title="Switch unit"><span data-u="MT">MT</span><span data-u="Kg">Kg</span></div>
    </div>
    <button class="btn pri" id="loadBtn">📂 <span class="lg">Load Plan File</span><span class="sm">Load</span></button>
  </header>
  <div class="banner" id="sampleBanner">Showing <b>sample numbers</b>. Tap <b>Load Plan File</b> and pick your plan (.xlsx or .csv) — it is remembered on this browser after the first load.</div>

  <div class="layout">
  <aside class="side">
    <div class="sticky">
      <div class="seg" id="seasonSeg"></div>
      <div class="tabs" id="tabs"></div>
    </div>
    <div class="fbar"><button class="btn fbtn" id="fBtn">⚙ Filters</button><div class="crumbs" id="crumbs"></div></div>
    <div class="filters" id="filters"></div>
  </aside>
  <main>
  <section id="v-overview"></section>
  <section id="v-targets" class="hide"></section>
  <section id="v-flash" class="hide"></section>
  <section id="v-quiz" class="hide"></section>
  </main>
  </div>
</div>

<script>
const SEASONS=['Rabi','Summer','Kharif','Total'];
const SEASON_LBL={Rabi:'Rabi',Summer:'Summer',Kharif:'Kharif',Total:'Total'};
const ATTRS=[{k:'focus',label:'Focus',vals:['Focus','Non-focus'],icon:{'Focus':'🎯','Non-focus':'◻️'},col:{'Focus':'#1d9e75','Non-focus':'#888780'}},
  {k:'color',label:'Corn type',vals:['Yellow','White'],icon:{'Yellow':'🟡','White':'⚪'},col:{'Yellow':'#ef9f27','White':'#85b7eb'}}];
const normAttr=(k,v)=>{v=String(v||'').trim();if(!v)return '';if(k==='focus')return /non|^nf$|^no$|^n$/i.test(v)?'Non-focus':'Focus';
  if(/white|^w$/i.test(v))return 'White';if(/yellow|^y$/i.test(v))return 'Yellow';return v};
const isAttrBy=b=>b&&b[0]==='§';const attrOf=k=>ATTRS.find(a=>a.k===k);
const MET_RE=/^(MP|PY|CY)_(Rabi|Summer|Kharif|Total)$/i;
const COLORS={Rabi:'#1f7a3f',Summer:'#d08a12',Kharif:'#2f6fb0'};
const LS=(()=>{try{localStorage.setItem('_t','1');localStorage.removeItem('_t');return localStorage}catch(e){return null}})();
const lsGet=(k,d)=>{try{const v=LS&&LS.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const lsSet=(k,v)=>{try{LS&&LS.setItem(k,JSON.stringify(v))}catch(e){}};

function detectDev(){const ua=navigator.userAgent||'';
  if(/iPad/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1))return 'ipad';
  if(/Android/.test(ua))return /Mobile/.test(ua)?'phone':'ipad';
  if(/iPhone|Mobile/.test(ua))return 'phone';
  return (window.innerWidth||1200)<600?'phone':'pc'}
const S={dev:'pc',fOpen:false,attr:{focus:'',color:''},has:{focus:false,color:false},unit:lsGet('rtc_unit','MT'),dims:[],rows:[],sample:true,fileName:'',season:'Rabi',filters:{},groupBy:'',tab:'overview',
  fc:{deck:[],i:0,flip:false,ok:0,miss:0,missed:[]},qz:{q:null,score:0,total:0,streak:0,best:lsGet('rtc_best',0)},
  mastery:lsGet('rtc_mastery',{})};

/* ---------- helpers ---------- */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* plan file values are in Kg. MT view = Kg/1000 rounded UP to whole MT; Kg view = exact */
function fmt(n){if(n==null||isNaN(n))return '–';
  if(S.unit==='MT'){const m=Math.ceil(Math.abs(n)/1000-1e-9)*Math.sign(n);return (Object.is(m,-0)?0:m).toLocaleString('en-IN')}
  return n.toLocaleString('en-IN',{maximumFractionDigits:2})}
function U(){return S.unit==='MT'?'MT':'Kg'}
function sub(n){return S.unit==='MT'?'MT':'Kg · ≈ '+(n/1000).toLocaleString('en-IN',{maximumFractionDigits:1})+' MT'}
function fmtShort(n){const a=Math.abs(n);if(a>=1e7)return (n/1e7).toFixed(2).replace(/\.?0+$/,'')+' Cr';if(a>=1e5)return (n/1e5).toFixed(2).replace(/\.?0+$/,'')+' L';if(a>=1e3)return (n/1e3).toFixed(1).replace(/\.0$/,'')+' K';return fmt(n)}
function pct(a,b){return b?((a-b)/b*100):null}
function share(a,b){return b?(a/b*100):null}
function pctTxt(p,signed=true){if(p==null||!isFinite(p))return '–';const s=(signed&&p>0?'+':'')+p.toFixed(Math.abs(p)<10?1:0)+'%';return s}
function cls(p){return p==null?'':p>=0?'up':'dn'}
function num(v){if(v==null||v==='')return 0;if(typeof v==='number')return v;const s=String(v).replace(/[, ]/g,'');const n=parseFloat(s);return isNaN(n)?NaN:n}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function keyOf(r,by){return isAttrBy(by)?(r.a&&r.a[by.slice(1)]||'(blank)'):r.d[by]}
function byLabel(by){by=by||S.groupBy;return isAttrBy(by)?attrOf(by.slice(1)).label:by}
function badge(k,v){const A=attrOf(k);if(!v||!A.vals.includes(v))return '';return `<span class="tg" style="--c:${A.col[v]}">${A.icon[v]} ${v}</span>`}
function setHas(){S.has={focus:S.rows.some(r=>r.a&&r.a.focus),color:S.rows.some(r=>r.a&&r.a.color)}}
function val(r,m,s){const k=m+'_'+s;if(k in r.v)return r.v[k];if(s==='Total')return ['Rabi','Summer','Kharif'].reduce((t,x)=>t+(r.v[m+'_'+x]||0),0);return 0}

/* ---------- sample data ---------- */
function sampleData(){
  const dims=['Division','Region','Territory','Hybrid'];
  const regs={North:{Punjab:['Ludhiana','Jalandhar'],Haryana:['Karnal','Hisar'],'UP West':['Meerut','Bareilly']},
    South:{Karnataka:['Davangere','Haveri'],Telangana:['Karimnagar','Warangal'],'Tamil Nadu':['Salem','Perambalur']},
    West:{Maharashtra:['Jalgaon','Aurangabad'],Gujarat:['Godhra','Himmatnagar'],MP:['Chhindwara','Indore']}};
  const hy=['RCH 386','RCH 9555','RCH 777','RCH 4204','RCH 501','RCH 222'];
  const HA={'RCH 386':['Focus','Yellow'],'RCH 9555':['Focus','Yellow'],'RCH 501':['Focus','White'],'RCH 777':['Non-focus','Yellow'],'RCH 4204':['Non-focus','White'],'RCH 222':['Non-focus','Yellow']};
  let seed=7;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
  const rows=[];
  for(const d in regs)for(const r in regs[d])for(const t of regs[d][r])for(const h of hy){
    const v={};
    for(const s of ['Rabi','Summer','Kharif']){
      const mp=Math.round((s==='Summer'?150:s==='Rabi'?600:900)*(0.5+rnd())*10)/10;
      const py=Math.round(mp*(0.05+rnd()*0.15)*10)/10;
      const cy=Math.round(py*(0.9+rnd()*0.5)*10)/10;
      v['MP_'+s]=Math.round(mp*1000);v['PY_'+s]=Math.round(py*1000);v['CY_'+s]=Math.round(cy*1000);
    }
    rows.push({d:{Division:d,Region:r,Territory:t,Hybrid:h},a:{focus:HA[h][0],color:HA[h][1]},v});
  }
  return {dims,rows};
}

/* ---------- parsing ---------- */
function parseAOA(aoa){
  let hi=-1;
  for(let i=0;i<Math.min(aoa.length,40);i++){
    const hits=(aoa[i]||[]).filter(c=>MET_RE.test(String(c||'').trim())).length;
    if(hits>=3){hi=i;break}
  }
  if(hi<0)return null;
  const head=aoa[hi].map(c=>String(c==null?'':c).trim());
  const met=[],dimIdx=[];
  head.forEach((h,i)=>{
    if(!h)return;
    const m=h.match(MET_RE);
    if(m)met.push({i,key:m[1].toUpperCase()+'_'+m[2][0].toUpperCase()+m[2].slice(1).toLowerCase()});
    else if(!/^(s\.?\s*no\.?|sr\.?\s*no\.?|sl\.?\s*no\.?|#)$/i.test(h))dimIdx.push({i,name:h});
  });
  // attribute columns: by header name first, then by their values
  const attrCol={};
  dimIdx.forEach(x=>{if(/focus/i.test(x.name)&&attrCol.focus==null)attrCol.focus=x.i;
    else if(/(yellow|white|colou?r|corn\s*type|grain)/i.test(x.name)&&attrCol.color==null)attrCol.color=x.i});
  const colVals=i=>aoa.slice(hi+1).map(l=>String((l||[])[i]==null?'':(l||[])[i]).trim()).filter(Boolean);
  dimIdx.forEach(x=>{if(Object.values(attrCol).includes(x.i))return;const vs=colVals(x.i);if(!vs.length)return;
    if(attrCol.color==null&&vs.every(v=>/^(yellow|white)(\s*corn)?$/i.test(v)))attrCol.color=x.i;
    else if(attrCol.focus==null&&vs.every(v=>/^(non[\s-]*)?focus(ed)?$|^nf$/i.test(v)))attrCol.focus=x.i});
  const attrIdx=Object.values(attrCol);
  for(let j=dimIdx.length-1;j>=0;j--)if(attrIdx.includes(dimIdx[j].i))dimIdx.splice(j,1);
  const rows=[];
  for(let r=hi+1;r<aoa.length;r++){
    const line=aoa[r]||[];
    const d={};let anyDim=false,isTotal=false;
    dimIdx.forEach(x=>{const v=line[x.i]==null?'':String(line[x.i]).trim();d[x.name]=v;if(v)anyDim=true;if(/^(grand\s*)?total$/i.test(v))isTotal=true});
    const v={};let bad=false,anyNum=false;
    met.forEach(x=>{const n=num(line[x.i]);if(isNaN(n))bad=true;else{v[x.key]=n;if(n)anyNum=true}});
    if(bad||isTotal||(!anyDim&&!anyNum))continue;
    if(!anyDim)continue;
    const a={};for(const k in attrCol)a[k]=normAttr(k,line[attrCol[k]]);
    rows.push({d,a,v});
  }
  // keep only dims that carry some value and are text-ish (not all numeric)
  const dims=dimIdx.map(x=>x.name).filter(n=>rows.some(r=>r.d[n])&&!rows.every(r=>!r.d[n]||!isNaN(Number(r.d[n]))));
  // drill order: Zone/Division → Region → Territory → (anything else, e.g. Crop/Hybrid) in file order
  const ORDER=[/^(zone|division)/i,/^region/i,/^(territory|terr|tm\b|hq)/i];
  const rk=n=>{const i=ORDER.findIndex(re=>re.test(n));return i<0?ORDER.length:i};
  dims.sort((a,b)=>rk(a)-rk(b));
  rows.forEach(r=>dims.forEach(n=>{if(!r.d[n])r.d[n]='(blank)'}));
  return {dims,rows};
}
function handleFile(f){
  const rd=new FileReader();
  const isCsv=/\.csv$/i.test(f.name);
  rd.onload=e=>{
    try{
      let res=null;
      if(isCsv&&typeof XLSX==='undefined'){
        res=parseAOA(csvToAOA(e.target.result));
      }else{
        if(typeof XLSX==='undefined')throw new Error('Excel reader could not load (no internet?). Save the sheet as CSV and load that.');
        const wb=isCsv?XLSX.read(e.target.result,{type:'string'}):XLSX.read(new Uint8Array(e.target.result),{type:'array'});
        for(const sn of wb.SheetNames){
          const aoa=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''});
          res=parseAOA(aoa);if(res&&res.rows.length)break;
        }
      }
      if(!res||!res.rows.length)throw new Error('Could not find the header row with MP_/PY_/CY_ columns (e.g. CY_Rabi).');
      S.dims=res.dims;S.rows=res.rows;S.sample=false;S.fileName=f.name;
      S.filters={};S.attr={focus:'',color:''};S.groupBy=S.dims[0];setHas();
      lsSet('rtc_data',{dims:S.dims,rows:S.rows,fileName:f.name,at:Date.now()});
      resetDecks();renderAll();
    }catch(err){showMsg('⚠️ '+err.message)}
  };
  isCsv?rd.readAsText(f):rd.readAsArrayBuffer(f);
}
function csvToAOA(t){const out=[];let row=[],cur='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){cur+='"';i++}else q=false}else cur+=c}else if(c=='"')q=true;else if(c==','){row.push(cur);cur=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;row.push(cur);out.push(row);row=[];cur=''}else cur+=c}if(cur||row.length){row.push(cur);out.push(row)}return out}
function showMsg(m){const b=document.getElementById('sampleBanner');b.classList.remove('hide');b.innerHTML=m}

/* ---------- data views ---------- */
function attrOk(r,skip){return ATTRS.every(A=>A.k===skip||!S.attr[A.k]||(r.a&&r.a[A.k])===S.attr[A.k])}
function filtered(upTo,skipAttr){
  return S.rows.filter(r=>attrOk(r,skipAttr)&&S.dims.every((d,i)=>{if(upTo!=null&&i>=upTo)return true;const f=S.filters[d];return !f||r.d[d]===f}));
}
function agg(rows,s){let mp=0,py=0,cy=0;rows.forEach(r=>{mp+=val(r,'MP',s);py+=val(r,'PY',s);cy+=val(r,'CY',s)});return {mp,py,cy}}
let opts_keepTags=false;
function groups(s,by){
  by=by||S.groupBy;const m=new Map();
  filtered().forEach(r=>{const k=keyOf(r,by);if(!m.has(k))m.set(k,[]);m.get(k).push(r)});
  const tot=agg(filtered(),s).cy;
  const arr=[...m].map(([name,rs])=>{const a=agg(rs,s);
    const tags=isAttrBy(by)?'':ATTRS.map(A=>{if(S.attr[A.k]&&!opts_keepTags)return '';const u=[...new Set(rs.map(r=>r.a&&r.a[A.k]).filter(Boolean))];return u.length===1?badge(A.k,u[0]):''}).join('');
    return {name,...a,tags,g:pct(a.cy,a.py),ms:share(a.cy,a.mp),pms:share(a.py,a.mp),sh:share(a.cy,tot)}});
  arr.sort((a,b)=>b.cy-a.cy);arr.forEach((x,i)=>x.rank=i+1);
  return arr;
}
function twin(x,mx){return `<div class="twin"><span>LY</span><div class="tr ly"><i style="width:${x.py/mx*100}%"></i></div><span class="n">${fmt(x.py)}</span><span>Plan</span><div class="tr pl"><i style="width:${x.cy/mx*100}%"></i></div><span class="n b">${fmt(x.cy)}</span></div>`}
function scopeLabel(){const f=S.dims.filter(d=>S.filters[d]).map(d=>S.filters[d]);const at=ATTRS.filter(A=>S.attr[A.k]).map(A=>S.attr[A.k]);return (f.length?f.join(' › '):'All India')+(at.length?' · '+at.join(' · '):'')}

function renderFilters(){
  const el=document.getElementById('filters');
  let h='';
  S.dims.forEach((d,i)=>{
    const opts=[...new Set(filtered(i).map(r=>r.d[d]))].sort();
    if(S.filters[d]&&!opts.includes(S.filters[d]))S.filters[d]='';
    h+=`<label>${esc(d)}<select data-d="${esc(d)}"><option value="">All</option>${opts.map(o=>`<option ${o===S.filters[d]?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`;
  });
  const byOpts=S.dims.map(d=>[d,d]).concat(ATTRS.filter(A=>S.has[A.k]).map(A=>['§'+A.k,A.label]));
  h+=`<label>Show by<select id="groupBy">${byOpts.map(([v,l])=>`<option value="${esc(v)}" ${v===S.groupBy?'selected':''}>${esc(l)}</option>`).join('')}</select></label>`;
  const chips=ATTRS.filter(A=>S.has[A.k]).map(A=>`<div class="chips"><span class="cl">${A.label}</span>${['',...A.vals].map(v=>`<button class="chip ${S.attr[A.k]===v?'on':''}" data-af="${A.k}" data-av="${v}">${v?A.icon[v]+' '+v:'All'}</button>`).join('')}</div>`).join('');
  if(chips)h+=`<div class="chipwrap">${chips}</div>`;
  el.innerHTML=h;
  const act=S.dims.filter(d=>S.filters[d]).concat(ATTRS.filter(A=>S.attr[A.k]).map(A=>A.k));
  document.getElementById('fBtn').textContent=(S.fOpen?'▲ ':'⚙ ')+'Filters'+(act.length?' ('+act.length+')':'');
  document.getElementById('crumbs').innerHTML=act.length?`📍 ${esc(scopeLabel())} &nbsp;<a id="clearF">✕ clear</a>`:'📍 All India — tap any card to drill down';
}
function renderTabs(){
  const t=[['overview','📊','Overview'],['targets','🎯','Targets'],['flash','🃏','Flashcards'],['quiz','🧠','Quiz']];
  document.getElementById('tabs').innerHTML=t.map(([k,i,l])=>`<button class="${S.tab===k?'on':''}" data-t="${k}"><span>${i}</span>${l}</button>`).join('');

    <div class="kpi"><div class="l">Last Year 2025-26 (${U()})</div><div class="v">${fmt(a.py)}</div><div class="s">Gap to plan: <span class="${cls(g)}">${a.cy-a.py>=0?'+':''}${fmt(a.cy-a.py)}</span></div></div>
    <div class="kpi"><div class="l">Growth vs LY</div><div class="v ${cls(g)}">${pctTxt(g)}</div><div class="s">${g==null?'No LY volume':g>=0?'Volume to add over LY':'Plan below LY'}</div></div>
    <div class="kpi"><div class="l">Market Potential (${U()})</div><div class="v">${fmt(a.mp)}</div><div class="s">Share: LY ${pctTxt(pms,false)} → Plan <b>${pctTxt(ms,false)}</b></div></div>
  </div>`;
  // season mix
  if(s==='Total'){
    const parts=['Rabi','Summer','Kharif'].map(x=>({x,v:agg(rows,x).cy}));const t=parts.reduce((p,c)=>p+c.v,0)||1;
    h+=`<div class="panel"><h3>Season mix of the annual plan</h3><div class="mix">${parts.map(p=>`<div style="width:${p.v/t*100}%;background:${COLORS[p.x]}">${p.v/t>0.08?p.x+' '+Math.round(p.v/t*100)+'%':''}</div>`).join('')}</div>
    <div class="meta">${parts.map(p=>`<span>${p.x}: <b>${fmt(p.v)}</b></span>`).join('')}</div></div>`;
  }
  h+=portfolioBI(s,a);
  // memory hooks
  const gr=groups(s);
  if(gr.length){
    const top=gr.slice(0,3),tot=a.cy||1,top3=top.reduce((p,c)=>p+c.cy,0);
    const fastest=gr.filter(x=>x.py>0).sort((x,y)=>y.g-x.g)[0];
    const lowShare=gr.filter(x=>x.mp>0).sort((x,y)=>x.ms-y.ms)[0];
    h+=`<div class="panel"><h3>💡 Remember this</h3><div style="line-height:1.7;font-size:14px">
      • ${esc(byLabel())} count: <b>${gr.length}</b> · Top 3 = <b>${Math.round(top3/tot*100)}%</b> of the plan (${top.map(x=>esc(x.name)).join(', ')})<br>
      • Biggest: <b>${esc(gr[0].name)}</b> — ${fmt(gr[0].cy)} (${pctTxt(gr[0].sh,false)} of plan)<br>
      ${fastest?`• Fastest growth needed: <b>${esc(fastest.name)}</b> ${pctTxt(fastest.g)} vs LY<br>`:''}
      ${lowShare?`• Most headroom: <b>${esc(lowShare.name)}</b> — plan is only ${pctTxt(lowShare.ms,false)} of market potential`:''}
    </div></div>`;
    // top bars
    const mx=Math.max(...gr.map(x=>Math.max(x.cy,x.py)))||1;
    h+=`<div class="panel"><h3>Plan by ${esc(byLabel())}</h3>${gr.slice(0,12).map(x=>`
      <div class="item" style="box-shadow:none;border:0;padding:6px 0" data-drill="${esc(x.name)}">
        <div class="row"><div class="grow nm">${x.rank}. ${esc(x.name)} ${x.tags}</div><span class="${cls(x.g)}" style="font-size:13px">${pctTxt(x.g)} vs LY</span></div>
        ${twin(x,mx)}
      </div>`).join('')}
      <div class="legend">Grey = Last Year 2025-26 · Green = Plan 2026-27 · in ${U()} · ${gr.length>12?'see Targets tab for all '+gr.length:''}</div></div>`;
  }
  document.getElementById('v-overview').innerHTML=h;
}

/* ---------- Portfolio business intelligence ---------- */
function mixTxt(d){if(Math.abs(d)<0.05)return '<span class="small">(no change in mix)</span>';return `<span class="${d>0?'up':'dn'}" style="font-size:13px">(${d>0?'▲':'▼'} ${Math.abs(d).toFixed(1)}% points)</span>`}
function attrSplit(k,s){const A=attrOf(k);const rows=filtered(null,k);const tot=agg(rows,s);
  return {tot,parts:A.vals.map(v=>{const a=agg(rows.filter(r=>r.a&&r.a[k]===v),s);return {v,...a,g:pct(a.cy,a.py),sh:share(a.cy,tot.cy),psh:share(a.py,tot.py),ms:share(a.cy,a.mp)}})}}
function portfolioBI(s,all){
  const ks=ATTRS.filter(A=>S.has[A.k]).map(A=>A.k);if(!ks.length)return '';
  let cards='',ins=[];
  ks.forEach(k=>{
    const A=attrOf(k),{tot,parts}=attrSplit(k,s);if(!tot.cy&&!tot.py)return;
    const mx=Math.max(1,...parts.map(p=>Math.max(p.cy,p.py)));
    cards+=`<div class="panel" style="margin:0"><h3>${A.label} split ${S.attr[k]?'<span class="small">(showing all, ignoring the '+A.label+' chip)</span>':''}</h3>
      <div class="mix">${parts.map(p=>`<div style="width:${(p.sh||0)}%;background:${A.col[p.v]}">${(p.sh||0)>12?A.icon[p.v]+' '+Math.round(p.sh)+'%':''}</div>`).join('')}</div>
      ${parts.map(p=>`<div style="margin-top:10px" data-af="${k}" data-av="${p.v}" class="clk"><div class="row"><div class="grow"><b>${A.icon[p.v]} ${p.v}</b> <span class="small">${pctTxt(p.psh,false)} → <b>${pctTxt(p.sh,false)}</b> of plan</span></div><span class="${cls(p.g)}" style="font-size:13px">${pctTxt(p.g)}</span></div>${twin(p,mx)}</div>`).join('')}
    </div>`;
    const a0=parts[0],a1=parts[1];
    const un={cy:tot.cy-a0.cy-a1.cy,py:tot.py-a0.py-a1.py};
    if(un.cy>tot.cy*0.005||un.py>tot.py*0.005)ins.push(`⚠️ Volume with no ${A.label} tag in the file: LY ${fmt(un.py)} · Plan ${fmt(un.cy)} ${U()} — shares above exclude it`);
    if(k==='focus'&&(a0.cy||a0.py)){
      const shift=(a0.sh||0)-(a0.psh||0);
      ins.push(`🎯 Focus share of total volume: LY ${pctTxt(a0.psh,false)} → Plan <b>${pctTxt(a0.sh,false)}</b> ${mixTxt(shift)}`);
      if(a0.g!=null&&a1.g!=null)ins.push(`🎯 Focus needs <b class="${cls(a0.g)}">${pctTxt(a0.g)}</b> growth vs Non-focus <b class="${cls(a1.g)}">${pctTxt(a1.g)}</b>${a0.g>a1.g?' — the push is on Focus':' — check: Non-focus growing faster'}`);
    }
    if(k==='color'&&(a1.cy||a1.py)){
      const shift=(a1.sh||0)-(a1.psh||0);
      ins.push(`⚪ White corn share of total volume: LY ${pctTxt(a1.psh,false)} → Plan <b>${pctTxt(a1.sh,false)}</b> ${mixTxt(shift)}`);
      ins.push(`🟡 Yellow volume growth <b class="${cls(a0.g)}">${pctTxt(a0.g)}</b> · ⚪ White volume growth <b class="${cls(a1.g)}">${pctTxt(a1.g)}</b>`);
    }
  });
  // top focus product(s) in scope by product-level dim
  if(S.has.focus){
    const pd=S.dims[S.dims.length-1];
    opts_keepTags=true;const fp=groups(s,pd).filter(x=>x.tags.includes('Focus</span>')&&!x.tags.includes('Non-focus')).slice(0,3);opts_keepTags=false;
    if(fp.length)ins.push(`🎯 Top Focus ${esc(pd)}: ${fp.map(x=>`<b>${esc(x.name)}</b> ${fmt(x.cy)}`).join(' · ')} ${U()}`);
  }
  // 2x2 matrix
  let mtx='';
  if(S.has.focus&&S.has.color&&!S.attr.focus&&!S.attr.color){
    const rows=filtered(),tot=agg(rows,s).cy||1;
    const cell=(f,c)=>{const a=agg(rows.filter(r=>r.a&&r.a.focus===f&&r.a.color===c),s);const g=pct(a.cy,a.py);
      return `<div class="clk" data-af2="${f}|${c}"><b>${fmt(a.cy)}</b><span class="small">${Math.round(a.cy/tot*100)}% of plan · <span class="${cls(g)}">${pctTxt(g)}</span></span></div>`};
    mtx=`<div class="panel" style="margin:0"><h3>Focus × Corn type (${U()})</h3><div class="mx">
      <div class="h"></div><div class="h">🟡 Yellow</div><div class="h">⚪ White</div>
      <div class="h" style="align-self:center">🎯 Focus</div>${cell('Focus','Yellow')}${cell('Focus','White')}
      <div class="h" style="align-self:center">◻️ Non-focus</div>${cell('Non-focus','Yellow')}${cell('Non-focus','White')}
      </div><div class="legend">Tap a box to filter to it.</div></div>`;
  }
  return `<div class="panel"><h3>📈 Portfolio intelligence</h3>${ins.length?`<div style="line-height:1.75;font-size:14px;margin-bottom:12px">${ins.map(i=>'• '+i).join('<br>')}</div>`:''}
    <div class="pf">${cards}${mtx}</div></div>`;
}

/* ---------- Flashcards ---------- */
function mkey(name){return S.season+'|'+S.groupBy+'|'+name}
function resetDecks(){S.fc={deck:[],i:0,flip:false,ok:0,miss:0,missed:[]};S.qz.q=null}
function buildDeck(only){
  let gr=groups(S.season).filter(x=>x.cy>0||x.py>0);
  if(only)gr=gr.filter(x=>only.includes(x.name));
  S.fc={deck:shuffle(gr),i:0,flip:false,ok:0,miss:0,missed:[]};
}
function renderFlash(){
  const el=document.getElementById('v-flash');
  if(!S.fc.deck.length)buildDeck();
  const F=S.fc;
  if(!F.deck.length){el.innerHTML='<div class="empty">No targets in this selection.</div>';return}
  if(F.i>=F.deck.length){
    const p=Math.round(F.ok/F.deck.length*100);
    el.innerHTML=`<div class="fc-wrap"><div class="qbox" style="text-align:center"><div style="font-size:46px">${p>=80?'🏆':p>=50?'💪':'📚'}</div>
      <div class="q">You knew ${F.ok} of ${F.deck.length} (${p}%)</div><div class="small">${esc(SEASON_LBL[S.season])} · by ${esc(byLabel())} · ${esc(scopeLabel())}</div>
      <div class="fc-btns">${F.missed.length?`<button class="btn miss" id="fcRetry">Retry ${F.missed.length} missed</button>`:''}<button class="btn pri" id="fcAgain">New round</button></div></div></div>`;
    return;
  }
  const x=F.deck[F.i];
  const m=S.mastery[mkey(x.name)]||{ok:0,miss:0};
  el.innerHTML=`<div class="fc-wrap">
    <div class="row small"><div class="grow">Card ${F.i+1} / ${F.deck.length} · ✅ ${F.ok} · ❌ ${F.miss}</div><button class="btn" id="fcShuffle" style="padding:5px 10px;font-size:12px">🔀 Restart</button></div>
    <div class="prog"><i style="width:${F.i/F.deck.length*100}%"></i></div>
    <div class="card3d ${F.flip?'flip':''}" id="card"><div class="in">
      <div class="face"><div class="tag">${esc(byLabel())} · ${esc(SEASON_LBL[S.season])} Plan 26-27</div>
        <div class="q">${esc(x.name)}</div>${x.tags?`<div style="margin-bottom:8px">${x.tags}</div>`:""}
        <div class="hint">Last year: <b>${fmt(x.py)}</b> · Market: <b>${fmt(x.mp)}</b> ${U()}</div>
        <div class="hint" style="margin-top:16px">Say the target aloud, then tap to check 👆</div>
        ${m.ok||m.miss?`<div class="small" style="margin-top:10px">Your record: ✅${m.ok} ❌${m.miss}</div>`:''}</div>
      <div class="face back"><div class="tag">${esc(x.name)} · ${esc(SEASON_LBL[S.season])} Plan</div>
        <div class="ans">${fmt(x.cy)}</div>
        <div class="sub">${sub(x.cy)} · Rank <b>#${x.rank}</b> of ${S.fc.deck.length}<br>
        Growth vs LY <b>${pctTxt(x.g)}</b> (${x.cy-x.py>=0?'+':''}${fmt(x.cy-x.py)})<br>
        MP share ${pctTxt(x.pms,false)} → <b>${pctTxt(x.ms,false)}</b> · ${pctTxt(x.sh,false)} of plan</div></div>
    </div></div>
    <div class="fc-btns ${F.flip?'':'hide'}"><button class="btn miss" id="fcMiss">❌ Missed</button><button class="btn ok" id="fcOk">✅ Got it</button></div>
    <div class="small swipehint" style="text-align:center;margin-top:10px">Tap to flip · swipe → <b>Got it</b> · swipe ← <b>Missed</b></div><div class="small kbhint" style="text-align:center;margin-top:10px">Keyboard: Space = flip · → Got it · ← Missed</div><div class="small" style="text-align:center;margin-top:4px">Deck follows your season, filters and “Show by” choice.</div>
  </div>`;
}
function fcMark(ok){
  const F=S.fc,x=F.deck[F.i],k=mkey(x.name);
  const m=S.mastery[k]||{ok:0,miss:0};ok?m.ok++:m.miss++;S.mastery[k]=m;lsSet('rtc_mastery',S.mastery);
  buzz(ok?15:[25,50,25]);ok?F.ok++:(F.miss++,F.missed.push(x.name));F.i++;F.flip=false;renderFlash();
}

/* ---------- Quiz ---------- */
function makeQ(){
  const gr=groups(S.season).filter(x=>x.cy>0);
  if(!gr.length)return null;
  const types=gr.length>=4?['val','val','top','growth']:['val','growth'];
  const t=types[Math.floor(Math.random()*types.length)];
  const x=gr[Math.floor(Math.random()*gr.length)];
  const sl=SEASON_LBL[S.season];
  if(t==='top'){
    const four=shuffle(gr).slice(0,4);const best=four.reduce((a,b)=>b.cy>a.cy?b:a);
    return {text:`Which ${esc(byLabel())} has the <b>highest ${sl} plan</b>?`,opts:four.map(o=>({l:o.name,ok:o===best})),
      explain:four.sort((a,b)=>b.cy-a.cy).map(o=>`${esc(o.name)}: ${fmt(o.cy)}`).join(' · ')};
  }
  if(t==='growth'&&x.py>0){
    const g=x.g;const set=new Set([g.toFixed(0)]);const opts=[{l:pctTxt(g),ok:true,v:g}];
    const deltas=shuffle([-25,-15,-10,10,15,25,35,-35]);
    for(const d of deltas){if(opts.length>=4)break;const v=g+d;if(set.has(v.toFixed(0)))continue;set.add(v.toFixed(0));opts.push({l:pctTxt(v),ok:false})}
    return {text:`${sl} plan growth over last year for <b>${esc(x.name)}</b>?`,opts:shuffle(opts),explain:`LY ${fmt(x.py)} → Plan ${fmt(x.cy)}`};
  }
  // value question: distractors from peers with similar size, else scaled
  const peers=shuffle(gr.filter(o=>o!==x&&Math.abs(o.cy-x.cy)>x.cy*0.04)).sort((a,b)=>Math.abs(a.cy-x.cy)-Math.abs(b.cy-x.cy)).slice(0,6);
  let cand=shuffle(peers).slice(0,3).map(o=>o.cy);
  const muls=shuffle([0.8,0.88,1.12,1.2,1.3,0.7]);
  const seen=new Set([fmt(x.cy)]);cand=cand.filter(v=>{const l=fmt(v);if(seen.has(l))return false;seen.add(l);return true});
  let k=0;while(cand.length<3&&k<40){k++;const f=muls.length?muls.pop():(0.6+Math.random()*0.8);const v=x.cy*f;const l=fmt(v);if(!seen.has(l)){seen.add(l);cand.push(v)}}
  return {text:`What is the <b>${sl} plan 2026-27</b> for <b>${esc(x.name)}</b>?`,sub:`Hint: last year was ${fmt(x.py)}`,
    opts:shuffle([{l:fmt(x.cy),ok:true},...cand.map(v=>({l:fmt(v),ok:false}))]),explain:`Rank #${x.rank} · ${pctTxt(x.g)} vs LY`};
}
function renderQuiz(){
  const Q=S.qz;const el=document.getElementById('v-quiz');
  if(!Q.q)Q.q=makeQ();
  if(!Q.q){el.innerHTML='<div class="empty">No targets in this selection.</div>';return}
  const q=Q.q;
  el.innerHTML=`<div class="fc-wrap">
    <div class="score"><span class="pill">Score ${Q.score}/${Q.total}</span><span class="pill">🔥 Streak ${Q.streak}</span><span class="pill">🏅 Best ${Q.best}</span></div>
    <div class="qbox"><div class="small">${esc(byLabel())} · ${esc(scopeLabel())}</div>
      <div class="q">${q.text}</div>${q.sub&&!q.done?`<div class="small">${esc(q.sub)}</div>`:''}
      <div class="opts">${q.opts.map((o,i)=>`<button class="opt ${q.done?(o.ok?'right':(q.pick===i?'wrong':'')):''}" data-o="${i}" ${q.done?'disabled':''}>${esc(o.l)}</button>`).join('')}</div>
      ${q.done?`<div class="small" style="margin-top:10px">${q.explain}</div><div class="fc-btns"><button class="btn pri" id="qNext">Next question →</button></div>`:''}
    </div></div>`;
}
function qPick(i){
  const Q=S.qz,q=Q.q;if(q.done)return;q.done=true;q.pick=i;Q.total++;
  buzz(q.opts[i].ok?15:[25,50,25]);
  if(q.opts[i].ok){Q.score++;Q.streak++;if(Q.streak>Q.best){Q.best=Q.streak;lsSet('rtc_best',Q.best)}}else Q.streak=0;
  renderQuiz();
}

/* ---------- master render & events ---------- */
function applyDev(){document.body.className='dev-'+S.dev;
  document.querySelectorAll('#devSw span').forEach(e=>e.classList.toggle('on',e.dataset.dv===S.dev));
  document.getElementById('filters').classList.toggle('open',S.fOpen)}
function buzz(p){try{if(S.dev!=='pc'&&navigator.vibrate)navigator.vibrate(p)}catch(e){}}
function renderAll(){
  applyDev();
  document.querySelectorAll('#unitSw span').forEach(e=>e.classList.toggle('on',e.dataset.u===S.unit));
  renderSeason();renderFilters();renderTabs();
  if(S.tab==='overview')renderOverview();
  if(S.tab==='targets')renderTargets();
  if(S.tab==='flash')renderFlash();
  if(S.tab==='quiz')renderQuiz();
  lsSet('rtc_ui',{season:S.season,tab:S.tab,groupBy:S.groupBy,filters:S.filters,attr:S.attr});
}
function drill(name){
  if(isAttrBy(S.groupBy)){S.attr[S.groupBy.slice(1)]=name;S.groupBy=S.dims[S.dims.length-1];searchQ='';resetDecks();renderAll();window.scrollTo({top:0,behavior:'smooth'});return}
  S.filters[S.groupBy]=name;
  const i=S.dims.indexOf(S.groupBy);
  if(i<S.dims.length-1)S.groupBy=S.dims[i+1];
  searchQ='';resetDecks();renderAll();window.scrollTo({top:0,behavior:'smooth'});
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-dv],#fBtn,[data-af],[data-af2],#unitSw,[data-s],[data-t],[data-drill],[data-o],#loadBtn,#clearF,#card,#fcOk,#fcMiss,#fcAgain,#fcRetry,#fcShuffle,#qNext');
  if(!t)return;
  if(t.dataset.dv){S.dev=t.dataset.dv;lsSet('rtc_dev',S.dev);renderAll();window.scrollTo(0,0)}
  else if(t.id==='fBtn'){S.fOpen=!S.fOpen;renderAll()}
  else if(t.dataset.af){S.attr[t.dataset.af]=S.attr[t.dataset.af]===t.dataset.av?'':t.dataset.av;resetDecks();renderAll()}
  else if(t.dataset.af2){const [f,c]=t.dataset.af2.split('|');S.attr.focus=f;S.attr.color=c;resetDecks();renderAll()}
  else if(t.id==='unitSw'){S.unit=S.unit==='MT'?'Kg':'MT';lsSet('rtc_unit',S.unit);if(S.qz.q&&!S.qz.q.done)S.qz.q=null;renderAll()}
  else if(t.dataset.s){S.season=t.dataset.s;resetDecks();renderAll()}
  else if(t.dataset.t){S.tab=t.dataset.t;renderAll()}
  else if(t.dataset.drill!=null){if(S.dims.indexOf(S.groupBy)<S.dims.length)drill(t.dataset.drill)}
  else if(t.dataset.o!=null)qPick(+t.dataset.o);
  else if(t.id==='loadBtn')document.getElementById('file').click();
  else if(t.id==='clearF'){S.filters={};S.attr={focus:'',color:''};S.groupBy=S.dims[0];resetDecks();renderAll()}
  else if(t.id==='card'){if(Date.now()-lastSwipe<450)return;S.fc.flip=!S.fc.flip;renderFlash()}
  else if(t.id==='fcOk')fcMark(true);
  else if(t.id==='fcMiss')fcMark(false);
  else if(t.id==='fcAgain'||t.id==='fcShuffle'){buildDeck();renderFlash()}
  else if(t.id==='fcRetry'){buildDeck(S.fc.missed);renderFlash()}
  else if(t.id==='qNext'){S.qz.q=makeQ();renderQuiz()}
});
document.addEventListener('change',e=>{
  if(e.target.id==='file'&&e.target.files[0]){handleFile(e.target.files[0]);e.target.value=''}
  else if(e.target.id==='groupBy'){S.groupBy=e.target.value;searchQ='';resetDecks();renderAll()}
  else if(e.target.dataset.d){
    const d=e.target.dataset.d,i=S.dims.indexOf(d);S.filters[d]=e.target.value;
    S.dims.slice(i+1).forEach(x=>{if(S.filters[x]&&!filtered(S.dims.indexOf(x)).some(r=>r.d[x]===S.filters[x]))S.filters[x]=''});
    if(e.target.value&&S.groupBy===d&&i<S.dims.length-1)S.groupBy=S.dims[i+1];
    resetDecks();renderAll();
  }
});
let tx=null,ty=0,lastSwipe=0;
document.addEventListener('touchstart',e=>{if(S.tab==='flash'&&e.target.closest('#card')){tx=e.touches[0].clientX;ty=e.touches[0].clientY}else tx=null},{passive:true});
document.addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;tx=null;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.3){lastSwipe=Date.now();if(!S.fc.flip){S.fc.flip=true;renderFlash()}else fcMark(dx>0)}},{passive:true});
document.addEventListener('keydown',e=>{
  if(S.tab!=='flash'||e.target.tagName==='INPUT')return;
  if(e.key===' '){e.preventDefault();S.fc.flip=!S.fc.flip;renderFlash()}
  else if(S.fc.flip&&(e.key==='ArrowRight'||e.key==='y'))fcMark(true);
  else if(S.fc.flip&&(e.key==='ArrowLeft'||e.key==='n'))fcMark(false);
});

/* ---------- boot ---------- */
(function boot(){
  const saved=lsGet('rtc_data',null);
  if(saved&&saved.rows&&saved.rows.length){S.dims=saved.dims;S.rows=saved.rows;S.sample=false;S.fileName=saved.fileName+' · loaded '+new Date(saved.at).toLocaleDateString('en-IN')}
  else{const d=sampleData();S.dims=d.dims;S.rows=d.rows}
  S.dev=lsGet('rtc_dev',null)||detectDev();
  setHas();
  const ui=lsGet('rtc_ui',{});
  if(ui.season&&SEASONS.includes(ui.season))S.season=ui.season;
  if(ui.tab)S.tab=ui.tab;
  S.groupBy=(S.dims.includes(ui.groupBy)||(isAttrBy(ui.groupBy)&&S.has[ui.groupBy.slice(1)]))?ui.groupBy:S.dims[0];
  if(ui.attr&&!S.sample)S.attr={focus:ui.attr.focus||'',color:ui.attr.color||''};
  if(ui.filters&&!S.sample)S.dims.forEach(d=>{if(ui.filters[d])S.filters[d]=ui.filters[d]});
  renderAll();
})();
</script>
